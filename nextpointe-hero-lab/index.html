<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NextPointe Hero Lab</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#020504;color:#f5f7f6;font-family:Inter,Arial,sans-serif}body{min-height:100vh}
.hero{position:relative;min-height:760px;overflow:hidden;isolation:isolate;background:radial-gradient(ellipse at 74% 48%,rgba(0,229,160,.13),transparent 34%),radial-gradient(ellipse at 52% 110%,rgba(0,229,160,.11),transparent 48%),linear-gradient(120deg,#020303 0%,#020706 48%,#00130d 100%)}
.hero:before{content:"";position:absolute;z-index:0;left:22%;right:-16%;bottom:-19%;height:52%;border-radius:50%;background:radial-gradient(ellipse,rgba(0,229,160,.19),rgba(0,229,160,.045) 42%,transparent 70%);filter:blur(34px);transform:rotate(-7deg)}
.ribbon{position:absolute;z-index:1;width:1050px;height:360px;right:-340px;top:235px;border-radius:50%;border:1px solid rgba(54,255,188,.13);transform:rotate(-16deg);box-shadow:0 -22px 85px rgba(0,229,160,.045);pointer-events:none}
.ribbon.r2{width:780px;height:250px;right:-60px;top:340px;opacity:.55;transform:rotate(9deg)}
.wrap{position:relative;z-index:4;width:min(1180px,88vw);margin:auto;min-height:760px;display:flex;align-items:center}
.copy{width:min(570px,47vw);padding:40px 0}
.eyebrow{margin:0 0 22px;color:#00e5a0;font:600 12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase}
h1{margin:0;max-width:9.4ch;font-size:clamp(52px,5.5vw,84px);line-height:.94;letter-spacing:-.06em;font-weight:760}
h1 span{display:block;color:#00e5a0}
.lede{max-width:460px;margin:27px 0 31px;color:rgba(239,246,243,.68);font-size:18px;line-height:1.58}
.actions{display:flex;gap:12px;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 21px;text-decoration:none;font-weight:750;font-size:14px;border-radius:4px}.primary{background:#00df9d;color:#00130d}.ghost{border:1px solid rgba(255,255,255,.16);color:#fff;background:rgba(255,255,255,.025)}
.stage{position:absolute;z-index:3;right:-14vw;top:50%;width:clamp(720px,63vw,1120px);height:clamp(720px,63vw,1120px);transform:translateY(-50%);pointer-events:none}
.stage:before{content:"";position:absolute;inset:13%;border-radius:50%;background:radial-gradient(circle,rgba(0,229,160,.2),rgba(0,229,160,.05) 44%,transparent 70%);filter:blur(30px)}
#core3d{position:absolute;inset:0;width:100%;height:100%;display:block}
.status{position:absolute;right:18px;bottom:14px;z-index:8;color:rgba(220,240,232,.42);font:10px ui-monospace,monospace;letter-spacing:.12em}
@media(max-width:900px){.hero,.wrap{min-height:850px}.wrap{align-items:flex-end;padding-bottom:70px}.copy{width:100%;max-width:600px}.stage{width:720px;height:720px;right:-240px;top:30%}h1{font-size:clamp(48px,11vw,72px)}}
@media(max-width:600px){.hero,.wrap{min-height:820px}.wrap{width:88vw;padding-bottom:52px}.copy{padding:0}.stage{width:610px;height:610px;right:-270px;top:27%}.eyebrow{font-size:10px}.lede{font-size:16px}.ribbon{display:none}}
</style>
</head>
<body>
<section class="hero">
  <div class="ribbon"></div><div class="ribbon r2"></div>
  <div class="stage" id="stage"><canvas id="core3d"></canvas></div>
  <div class="wrap">
    <div class="copy">
      <p class="eyebrow">Cisco Webex · AI · CRM Integration</p>
      <h1>Business communications.<span>Reimagined.</span></h1>
      <p class="lede">Voice, messaging, contact center and AI, connected in one intelligent platform.</p>
      <div class="actions"><a class="btn primary" href="#">Book a Demo →</a><a class="btn ghost" href="#">See how it works</a></div>
    </div>
  </div>
  <div class="status" id="status">LOADING COMMUNICATIONS CORE…</div>
</section>
<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/+esm";
import { STLLoader } from "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/STLLoader.js/+esm";
const MODEL="https://assets.cdn.filesafe.space/mhYINaszQSh466H9YX6C/media/6ac10263c478ac55359dc483.stl";
const stage=document.getElementById("stage"),canvas=document.getElementById("core3d"),status=document.getElementById("status");
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(29,1,.1,100);camera.position.set(0,0,5.1);
const renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true,powerPreference:"high-performance"});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;
scene.add(new THREE.HemisphereLight(0xeafff8,0x00140e,1.35));
const key=new THREE.DirectionalLight(0xffffff,5.4);key.position.set(-3,5,5);scene.add(key);
const rim=new THREE.PointLight(0x00e5a0,32,12,2);rim.position.set(-3,-.5,3);scene.add(rim);
const edge=new THREE.PointLight(0x72ffd0,20,10,2);edge.position.set(3,2,-1);scene.add(edge);
const pivot=new THREE.Group();pivot.rotation.set(.10,.55,-.10);scene.add(pivot);
const mat=new THREE.MeshPhysicalMaterial({color:0x00b77e,metalness:.58,roughness:.24,clearcoat:.72,clearcoatRoughness:.16});
new STLLoader().load(MODEL,g=>{
 g.computeVertexNormals();g.center();const mesh=new THREE.Mesh(g,mat);
 const box=new THREE.Box3().setFromObject(mesh),size=new THREE.Vector3();box.getSize(size);const m=Math.max(size.x,size.y,size.z)||1;mesh.scale.setScalar(2.55/m);
 pivot.add(mesh);status.textContent="LIVE · STL SOURCE";animate();
},undefined,e=>{console.error(e);status.textContent="MODEL LOAD FAILED · CHECK CORS";});
function resize(){const r=stage.getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix()}resize();new ResizeObserver(resize).observe(stage);
let tx=0,ty=0,cx=0,cy=0;window.addEventListener("pointermove",e=>{const r=stage.getBoundingClientRect();tx=THREE.MathUtils.clamp((e.clientX-r.left-r.width/2)/(r.width/2),-1,1)*.075;ty=THREE.MathUtils.clamp((e.clientY-r.top-r.height/2)/(r.height/2),-1,1)*-.06});
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime();cx+=(tx-cx)*.035;cy+=(ty-cy)*.035;pivot.rotation.y=.55+cx+Math.sin(t*.32)*.025;pivot.rotation.x=.10+cy+Math.sin(t*.44)*.012;pivot.position.y=Math.sin(t*.55)*.035;renderer.render(scene,camera)}
</script>
</body>
</html>
